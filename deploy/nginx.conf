# VARA EdTech AI Assistant — Nginx site config
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vara-assistant
#   sudo ln -s /etc/nginx/sites-available/vara-assistant /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ai.varaedtech.com
#
# HTTPS is not optional here: browsers only grant microphone access on a
# secure origin, so the assistant simply will not work over plain http.

server {
    listen 80;
    listen [::]:80;
    server_name ai.varaedtech.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.varaedtech.com;

    # Certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/ai.varaedtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.varaedtech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf font/woff2;

    client_max_body_size 2m;

    # Long-cache immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    90s;
        proxy_connect_timeout 30s;
        proxy_cache_bypass    $http_upgrade;
    }

    # Lead data is never public. /api/leads already requires a token; this is
    # a second lock. Remove or restrict to your office IP as you prefer.
    location = /api/leads {
        # allow 203.0.113.10;   # <- your office IP
        # deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
